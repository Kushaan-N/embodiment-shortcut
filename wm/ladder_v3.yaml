# prereg_addendum_A3.md, Experiment M: two MILD physics corruptions vs WM-base-100.
# Fixed before any M model was trained.  Not a ladder: each corrupted model is
# gated and tested against the base model separately (97.5% CIs, Bonferroni over 2).
base:
  name: WM-base
  vae:
    kind: compact
    latent_channels: 4
    downsample: 8
    ckpt: null
  transformer:
    params_millions: 90.5
    dim: 768
    depth: 6
    heads: 12
    patch: 2
    action_conditioning: adaln
    max_frames: 16
    attention: factorised
    autoregressive: true
  train:
    corpus: INTERACT
    fraction: 1.0
    steps: 120000
    batch_size: 16
    lr: 0.0001
    warmup: 2000
    precision: bf16
    max_hours_per_job: 1.8
    ckpt_every_steps: 2000
models:
- id: 1
  name: WM-base-100
  from: base
  checkpoint_at: 120000
  note: full training
- id: 10
  name: WM-physics-mild-0.25
  from: base
  overrides:
    train:
      friction_mult: 0.25
  note: 'friction x0.25: a mild corruption that loses no rollouts (prereg_addendum_A3.md,
    Experiment M)'
- id: 11
  name: WM-physics-mild-0.5
  from: base
  overrides:
    train:
      friction_mult: 0.5
  note: 'friction x0.5: a mild corruption that loses no rollouts (prereg_addendum_A3.md,
    Experiment M)'
controls:
  appearance_gap:
    name: free-space-motion
    note: Short free-space arm motions with no object contact, so physics divergence
      is near zero by construction.  Separates domain gap from physics error.
    n_rollouts: 300
  domain_shift:
    note: Feature-space FID-style distance between generated and real renders.  Do
      not assume it away; report it, and report clean-IDM vs augmented-IDM deltas
      alongside.
evaluation:
  n_rollouts_per_model: 1500
  held_out_action_set: test
  metrics:
  - id: standard
    idm_variant: A-std
    augmented: true
  - id: ogaf
    idm_variant: A-del
    augmented: true
  - id: dino_state_distance
    horizon: s_del
  also_report_clean_idm: true
s1_checks:
- determinism: same seed twice -> identical output
- two_action_divergence: two different actions -> materially different video
- frame_count_exact
- frame0_matches_conditioning
- per_frame_pixel_std_above_floor
- consecutive_frame_difference_above_floor
gate: paired_object
c3b_base: WM-base-100
c3b_corrupted:
- WM-physics-mild-0.25
- WM-physics-mild-0.5
ci_level: 0.975
addendum: prereg_addendum_A3.md
