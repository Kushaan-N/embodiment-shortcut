# Faithful reproduction record for the standard action-following protocol.
#
# Spec §0.6: "read the cited paper and mirror it exactly; record every protocol
# choice you extract from it in metadata.json ... never silently substitute your
# best guess for a faithfulness-critical detail."
#
# This file IS that record.  `protocol.py` refuses to build the A-std model
# unless every field below carries a provenance status, and every field whose
# status is not PAPER or VPT carries a non-empty `justification` and
# `decided_by`.  The whole table is copied into metadata.json for every
# Architecture A run, and analyze.py prints it.
#
# Provenance statuses
#   PAPER   - stated verbatim in MultiWorld §B.2 (quote in `quote`)
#   VPT     - not in MultiWorld, but §B.2 says "Following VPT [2]", which makes
#             VPT (arXiv:2206.11795) the authority for what §B.2 leaves out
#   ADAPTED - a PAPER/VPT value that cannot be transplanted verbatim to this
#             environment; the adaptation rule is recorded
#   DECIDED - neither paper states it; a human decision, recorded here
#
# STATUS: fields marked `decided_by: implementing-agent` have NOT been reviewed
# by a human.  They are loud, not silent -- but they are still the agent's call.
# Review them before the Architecture A trainings that back the C1 claim.

source:
  paper: "MultiWorld: Scalable Multi-Agent Multi-View Video World Models"
  arxiv: "2604.18564"
  version: v2
  section: "Appendix 0.B.2 Action Following"
  retrieved: "2026-08-17"
  quote: >-
    Following VPT [2], we train a bidirectional Inverse Dynamics Model (IDM) to
    infer actions from given video sequences. The IDM architecture uses a
    ResNet-50 backbone, followed by a temporal processing layer, to predict
    discrete and continuous actions, respectively. We train the model on the
    same training dataset for 20 epochs with a learning rate of 10-4. To
    evaluate the action-following performance of our multi-agent, multi-view
    world model, we feed the generated videos into the IDM and compute accuracy
    for discrete actions and Mean Squared Error (MSE) for continuous actions.
  secondary:
    paper: "Video PreTraining (VPT)"
    arxiv: "2206.11795"
    relevant: >-
      The VPT IDM is non-causal: it is trained to predict all 128 actions of a
      video sequence at once, seeing both past and future frames. Architecture
      is an initial non-causal temporal convolution, a ResNet trunk, and
      residual transformer layers that are NOT causally masked (the behavioural
      cloning model is described as the same architecture minus the initial
      non-causal convolution and with the transformer layers causally masked).
      At inference the IDM slides over the video with stride 64 and keeps only
      the centre 64 predictions of each 128-frame window.

fields:

  input_regime:
    value: clip
    status: PAPER
    quote: "bidirectional Inverse Dynamics Model (IDM) to infer actions from given video sequences"
    note: >-
      Decisive for T8.  A bidirectional/VPT-style IDM consumes a video
      sequence, not a frame pair.  A-std is therefore a CLIP model, and the
      shortcut is available across the entire action-execution window.  This is
      what makes A-std the faithful reproduction the C1 claim must hold for.

  backbone:
    value: resnet50
    status: PAPER
    quote: "The IDM architecture uses a ResNet-50 backbone"

  temporal_aggregation:
    value: noncausal_transformer
    status: VPT
    note: >-
      §B.2 says only "a temporal processing layer".  VPT specifies non-causal
      temporal convolution followed by unmasked residual transformer layers.
      Causal masking here would break the stated bidirectionality.

  temporal_layers:
    value: 2
    status: DECIDED
    decided_by: implementing-agent
    justification: >-
      Neither paper states a layer count usable at this scale (VPT's trunk is
      sized for 128-frame Minecraft video and ~0.5B-frame pretraining).  Two
      unmasked transformer encoder layers over a 16-token sequence is the
      smallest stack that can express the cross-frame comparison the metric
      needs.  Sensitivity to this value is reported in the appendix.

  temporal_width:
    value: 512
    status: DECIDED
    decided_by: implementing-agent
    justification: "Matches the ResNet-50 feature projection width; not a paper value."

  clip_length:
    value: 16
    status: ADAPTED
    adapted_from: "VPT: 128 frames"
    decided_by: implementing-agent
    justification: >-
      VPT's 128-frame window covers ~6.4 s of 20 Hz Minecraft video.  One
      rollout here is 1.5 s of arm motion to canonical rest (30 frames at
      VIDEO_FPS=20), so a 128-frame window does not exist to be copied.  16
      frames spans the entire action-execution window [s_0, s_std] at ~1.2x the
      native frame stride, i.e. the IDM sees every phase of the push.
      Transplanting the *coverage* (whole action window, non-causal) rather
      than the *number* is the faithful reading.  A-clip-del uses the same
      length over [s_0, s_del].

  clip_span:
    value: "[s_0, s_std]"
    status: ADAPTED
    decided_by: implementing-agent
    justification: >-
      VPT labels every frame of a long video; MultiWorld scores a generated
      clip against the action it was conditioned on.  Here one rollout carries
      exactly one action, so the corresponding window is the interval over
      which that action is executed.

  epochs:
    value: 20
    status: PAPER
    quote: "for 20 epochs"

  learning_rate:
    value: 1.0e-4
    status: PAPER
    quote: "with a learning rate of 10-4"

  loss:
    value: mse
    status: PAPER
    quote: "Mean Squared Error (MSE) for continuous actions"
    note: >-
      MSE is the training loss because the paper says so.  §7.1 additionally
      REPORTS normalised MAE as primary, which is an evaluation choice, not a
      change to the reproduced protocol.

  action_head:
    value: continuous_only
    status: ADAPTED
    adapted_from: "paper predicts discrete AND continuous actions"
    decided_by: implementing-agent
    justification: "This environment's action space is R^3 continuous; there are no discrete dims."

  optimizer:
    value: adamw
    status: DECIDED
    decided_by: implementing-agent
    justification: "Not stated in §B.2 or VPT's public description. AdamW is the field default for a 1e-4 ResNet-50 finetune."

  weight_decay:
    value: 0.01
    status: DECIDED
    decided_by: implementing-agent
    justification: "Not stated. PyTorch AdamW default-adjacent; recorded so it is not invisible."

  batch_size:
    value: 32
    status: DECIDED
    decided_by: implementing-agent
    justification: "Not stated. Chosen to fit a 16-frame 224x224 clip batch on one A100-40GB."

  lr_schedule:
    value: cosine_with_warmup
    status: DECIDED
    decided_by: implementing-agent
    justification: "Not stated. Warmup 5% of steps; reported, and ablated against constant-lr in the appendix."

  backbone_init:
    value: imagenet_pretrained
    status: DECIDED
    decided_by: implementing-agent
    justification: >-
      Not stated.  A published IDM at this scale is essentially always
      initialised from ImageNet weights, and a randomly-initialised ResNet-50
      on an 18k-rollout corpus would be a weaker baseline than practice, which
      is exactly the strawman T1 forbids.

  input_normalisation:
    value: imagenet_mean_std
    status: DECIDED
    decided_by: implementing-agent
    justification: "Follows from imagenet_pretrained backbone_init."

  image_resolution:
    value: 224
    status: DECIDED
    decided_by: implementing-agent
    justification: "ResNet-50 native; also DINO native, so both architectures see identical pixels."

  frame_conditioning:
    value: include_s0
    status: ADAPTED
    decided_by: implementing-agent
    justification: >-
      §6.4 makes s_0 the shared conditioning frame for every horizon and every
      condition.  Including it in the clip keeps A-std and the pair variants
      conditioned on the same information, so the horizon is the only thing
      that differs between them.

  reported_metric:
    value: "100 * (1 - MSE(a_pred, a_gt))"
    status: PAPER
    quote: "100x(1-MSE(apred,agt))"
    note: >-
      Recorded for completeness.  This project reports raw normalised MAE/MSE
      against an explicit [floor .. prior] axis (§7.3) instead, because the
      paper's affine rescaling hides both anchors.  Stated in the paper.
